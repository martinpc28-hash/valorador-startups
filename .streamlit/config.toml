[browser]
gatherUsageStats = false

[server]
headless = true

# Tema "libro mayor": la paleta sale del mundo del inversor (libros de cuentas, billetes, latón de
# notaría). Verde tinta como marca y como serie principal de los gráficos, latón para la referencia
# (la pre-money, el precio que se discute) y granate para pérdidas. Papel frío, ligeramente verdoso.
# Títulos en serif (Source Serif 4, tono de memo de comité) y cuerpo en Public Sans.
# Mismos valores que src/charts.py y src/memo_charts.py.
[theme]
base = "light"
primaryColor = "#1E5641"
backgroundColor = "#F6F7F3"
secondaryBackgroundColor = "#EBEFE8"
textColor = "#18211D"
linkColor = "#1E5641"
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["2.1rem", "1.55rem", "1.25rem", "1.08rem", "1rem", "0.9rem"]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
borderColor = "#D9DFD6"
dataframeBorderColor = "#D9DFD6"
dataframeHeaderBackgroundColor = "#E6ECE4"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#1E5641", "#B7862A", "#9C3535", "#3D5A80", "#86A893", "#6D4C7D", "#8C7B5A", "#4B524E"]
chartSequentialColors = ["#E1ECE5", "#C2DACB", "#A2C6B0", "#80AF94", "#5E9579", "#457F63", "#2F6B50", "#235A43", "#1A4A37", "#123A2B"]
chartDivergingColors = ["#7A2A2A", "#9C3535", "#C77B6F", "#E7C3B9", "#EEF0EA", "#C2DACB", "#80AF94", "#2F6B50", "#163F2F"]
# Colores con nombre (insignias, avisos, :color[texto]) dentro de la misma familia
greenColor = "#2F6B50"
greenBackgroundColor = "#E1ECE5"
greenTextColor = "#1E5641"
redColor = "#9C3535"
redBackgroundColor = "#F4E4E0"
redTextColor = "#7E2A2A"
orangeColor = "#B7862A"
orangeBackgroundColor = "#F5EBD6"
orangeTextColor = "#7A5814"
yellowColor = "#C49A2C"
yellowBackgroundColor = "#F6EED9"
yellowTextColor = "#6E5212"
blueColor = "#3D5A80"
blueBackgroundColor = "#E3E9F1"
blueTextColor = "#2C4466"
violetColor = "#6D4C7D"
violetBackgroundColor = "#EDE6F0"
violetTextColor = "#523A5E"
grayColor = "#5E6661"
grayBackgroundColor = "#E8ECE6"
grayTextColor = "#3F4642"

[theme.sidebar]
backgroundColor = "#EBEFE8"
secondaryBackgroundColor = "#F6F7F3"
