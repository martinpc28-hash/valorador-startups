[browser]
gatherUsageStats = false

[server]
headless = true

# Tema: neutros gris (Tailwind gray), un solo acento azul (el mismo de los gráficos), Inter y
# una escala de títulos contenida para que el veredicto y las cifras tengan más peso que los títulos.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f4f6"
textColor = "#111827"
linkColor = "#1d5fb8"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["2rem", "1.5rem", "1.2rem", "1.05rem", "1rem", "0.9rem"]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
borderColor = "#e5e7eb"
dataframeBorderColor = "#e5e7eb"
dataframeHeaderBackgroundColor = "#f3f4f6"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.sidebar]
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#ffffff"
